name: Paranoid Coverage

on:
  pull_request:
    paths:
      - '.github/workflows/paranoid-coverage.yml'
      - 'src/**'
      - 'tests/**'
      - 'PromptHelper.slnx'

permissions:
  contents: read

jobs:
  windows-coverage:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact audit code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Install coverage collector
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet-coverage --version

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore PromptHelper.slnx
          dotnet build PromptHelper.slnx -c Release --no-restore

      - name: Collect Windows full-suite coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/coverage -Force | Out-Null
          dotnet-coverage collect "dotnet test PromptHelper.slnx -c Release --no-build" -f cobertura -o artifacts/coverage/windows.cobertura.xml

      - name: Summarize Windows coverage
        shell: pwsh
        run: |
          [xml]$coverage = Get-Content artifacts/coverage/windows.cobertura.xml
          $root = $coverage.coverage
          "WINDOWS_LINE_RATE=$($root.'line-rate')" | Tee-Object -FilePath artifacts/coverage/windows-summary.txt
          "WINDOWS_BRANCH_RATE=$($root.'branch-rate')" | Tee-Object -FilePath artifacts/coverage/windows-summary.txt -Append
          $packages = @($root.packages.package) | Where-Object { $_.name -like 'PromptHelper*' -and $_.name -notlike '*Tests*' -and $_.name -notlike '*CrashHarness*' }
          foreach ($package in $packages) {
            "PACKAGE=$($package.name) LINE=$($package.'line-rate') BRANCH=$($package.'branch-rate')" | Tee-Object -FilePath artifacts/coverage/windows-summary.txt -Append
          }
          Get-Content artifacts/coverage/windows-summary.txt

      - name: Upload Windows coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paranoid-windows-coverage
          path: artifacts/coverage/*
          if-no-files-found: error

  linux-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact audit code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Install coverage collector
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet-coverage --version

      - name: Restore and build Linux tests
        run: |
          dotnet restore tests/PromptHelper.Core.Tests/PromptHelper.Core.Tests.csproj
          dotnet restore tests/PromptHelper.Platform.Linux.Tests/PromptHelper.Platform.Linux.Tests.csproj
          dotnet build tests/PromptHelper.Core.Tests/PromptHelper.Core.Tests.csproj -c Release --no-restore
          dotnet build tests/PromptHelper.Platform.Linux.Tests/PromptHelper.Platform.Linux.Tests.csproj -c Release --no-restore

      - name: Collect Linux core coverage
        run: |
          mkdir -p artifacts/coverage
          dotnet-coverage collect "dotnet test tests/PromptHelper.Core.Tests/PromptHelper.Core.Tests.csproj -c Release --no-build" -f cobertura -o artifacts/coverage/linux-core.cobertura.xml

      - name: Collect Linux platform coverage
        run: |
          dotnet-coverage collect "dotnet test tests/PromptHelper.Platform.Linux.Tests/PromptHelper.Platform.Linux.Tests.csproj -c Release --no-build" -f cobertura -o artifacts/coverage/linux-platform.cobertura.xml

      - name: Summarize Linux coverage
        shell: python
        run: |
          import pathlib
          import xml.etree.ElementTree as ET
          out = []
          for path in sorted(pathlib.Path("artifacts/coverage").glob("*.cobertura.xml")):
              root = ET.parse(path).getroot()
              out.append(f"{path.name} LINE_RATE={root.attrib.get('line-rate')} BRANCH_RATE={root.attrib.get('branch-rate')}")
              for package in root.findall("./packages/package"):
                  name = package.attrib.get("name", "")
                  if name.startswith("PromptHelper") and "Tests" not in name and "CrashHarness" not in name:
                      out.append(f"PACKAGE={name} LINE={package.attrib.get('line-rate')} BRANCH={package.attrib.get('branch-rate')}")
          text_value = "\n".join(out) + "\n"
          pathlib.Path("artifacts/coverage/linux-summary.txt").write_text(text_value, encoding="utf-8")
          print(text_value, end="")

      - name: Upload Linux coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paranoid-linux-coverage
          path: artifacts/coverage/*
          if-no-files-found: error
