name: Release

# CRUU15-011: the strict asset chain is a release *invariant*, not an opt-in workflow_dispatch
# input somebody has to remember to tick. Publishing a tag runs it unconditionally, and the
# job fails the release rather than shipping an executable whose icon nobody verified.
on:
  push:
    tags:
      - 'v*'
  # Exercisable on demand as well. This does not weaken the tag path: every step below runs
  # unconditionally either way, so there is no configuration in which a release is published
  # without the strict asset chain having passed.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-gate:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'

      - name: Verify finding coverage authority
        shell: pwsh
        run: ./tools/VerifyFindingCoverage.ps1

      - name: Verify repository release assets
        shell: pwsh
        run: ./tools/VerifyReleaseAssets.ps1 -RequireIcon

      - name: Verify icon is reproducible from the approved vector source
        shell: pwsh
        run: ./tools/VerifyIconGeneration.ps1

      - name: Audit icon generator dependencies
        run: npm audit --package-lock-only --audit-level=high --prefix tools/icon-generator

      - name: Restore
        run: dotnet restore PromptHelper.slnx

      - name: Build Release
        run: dotnet build PromptHelper.slnx -c Release --no-restore

      # CRUU15-005 and CRUU16-003 verify that reparse points are never followed. Those tests
      # fail rather than opt out, so the runner must be able to create symlinks; windows-ci.yml
      # arranges the same thing before its filesystem-integration job.
      - name: Enable symlink creation
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null

          $probeDir = Join-Path $env:RUNNER_TEMP 'symlink-probe'
          New-Item -ItemType Directory -Path $probeDir -Force | Out-Null
          Set-Content -Path (Join-Path $probeDir 'target.txt') -Value 'probe' -Encoding utf8
          cmd /c mklink "$probeDir\link.txt" "$probeDir\target.txt"
          if ($LASTEXITCODE -ne 0) { throw 'This runner cannot create file symlinks; the reparse-point tests cannot be verified here.' }

      - name: Full test suite
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --logger "trx;LogFileName=release-tests.trx"

      - name: Verify exact sentinels across all test evidence
        shell: pwsh
        run: |
          $required = Import-PowerShellDataFile ./tools/RequiredRegressionTests.psd1
          $trx = Get-ChildItem tests/PromptHelper.Tests/TestResults -Recurse -Filter '*.trx' | Select-Object -ExpandProperty FullName
          ./tools/VerifyTestEvidence.ps1 -TrxPath $trx -RequiredTests $required.Required

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish src/PromptHelper/PromptHelper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o artifacts/release

      - name: Verify published executable icon chain
        shell: pwsh
        run: >
          ./tools/VerifyReleaseAssets.ps1
          -RequireIcon
          -PublishedExe artifacts/release/PromptHelper.exe

      # Tag and manually dispatched release builds fail closed until the repository owner
      # configures the two signing secrets documented in docs/RELEASE_SIGNING.md. Keeping
      # unsigned output out of the release artifact is intentional.
      - name: Sign release executable
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PFX) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'Release signing secrets are not configured. See docs/RELEASE_SIGNING.md.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'prompt-helper-signing.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_PFX))

            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -File -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if ($null -eq $signTool) {
              throw 'signtool.exe was not found on the Windows runner.'
            }

            & $signTool.FullName sign `
              /fd SHA256 `
              /td SHA256 `
              /tr 'https://timestamp.digicert.com' `
              /f $certificatePath `
              /p $env:SIGNING_CERTIFICATE_PASSWORD `
              artifacts/release/PromptHelper.exe

            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & $signTool.FullName verify /pa /all artifacts/release/PromptHelper.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Restore pinned SBOM tool
        run: dotnet tool restore

      - name: Generate SPDX SBOM
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/PromptHelper/PromptHelper.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'PromptHelper.csproj does not define Version.'
          }

          dotnet tool run sbom-tool generate `
            -b artifacts/release `
            -bc . `
            -pn PromptHelper `
            -pv $version `
            -ps Ceegore `
            -nsb https://github.com/Ceegore/AI_prompt_helper `
            -V Verbose

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $releaseRoot = (Resolve-Path artifacts/release).Path
          $lines = Get-ChildItem $releaseRoot -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($releaseRoot, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            }

          [IO.File]::WriteAllLines(
            (Join-Path $releaseRoot 'SHA256SUMS.txt'),
            $lines,
            [Text.UTF8Encoding]::new($false))

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/release/**

      - name: Upload release artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: PromptHelper-release
          path: artifacts/release
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: error
