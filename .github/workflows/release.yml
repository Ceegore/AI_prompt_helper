name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      release_tag:
        description: Optional release tag when called as a reusable workflow.
        required: false
        type: string
      target_sha:
        description: Commit to package and, when publishing, tag.
        required: false
        type: string
      validation_only:
        description: Build and validate all release packages without publishing a GitHub release.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'

      - name: Verify release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/PromptHelper/PromptHelper.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag '$env:RELEASE_TAG' does not match Windows project version 'v$version'."
          }

      - name: Verify finding coverage authority
        shell: pwsh
        run: ./tools/VerifyFindingCoverage.ps1

      - name: Verify repository release assets
        shell: pwsh
        run: ./tools/VerifyReleaseAssets.ps1 -RequireIcon

      - name: Verify icon is reproducible from the approved vector source
        shell: pwsh
        run: ./tools/VerifyIconGeneration.ps1

      - name: Audit icon generator dependencies
        run: npm audit --package-lock-only --audit-level=high --prefix tools/icon-generator

      - name: Restore
        run: dotnet restore PromptHelper.slnx

      - name: Build Release
        run: dotnet build PromptHelper.slnx -c Release --no-restore

      - name: Enable symlink creation
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null

          $probeDir = Join-Path $env:RUNNER_TEMP 'symlink-probe'
          New-Item -ItemType Directory -Path $probeDir -Force | Out-Null
          Set-Content -Path (Join-Path $probeDir 'target.txt') -Value 'probe' -Encoding utf8
          cmd /c mklink "$probeDir\link.txt" "$probeDir\target.txt"
          if ($LASTEXITCODE -ne 0) {
            throw 'This runner cannot create file symlinks; the reparse-point tests cannot be verified here.'
          }

      - name: Full Windows test suite
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --logger "trx;LogFileName=release-tests.trx"

      - name: Verify exact sentinels across all test evidence
        shell: pwsh
        run: |
          $required = Import-PowerShellDataFile ./tools/RequiredRegressionTests.psd1
          $trx = Get-ChildItem tests/PromptHelper.Tests/TestResults -Recurse -Filter '*.trx' |
            Select-Object -ExpandProperty FullName
          ./tools/VerifyTestEvidence.ps1 -TrxPath $trx -RequiredTests $required.Required

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish src/PromptHelper/PromptHelper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o artifacts/windows-release

      - name: Verify published executable icon chain
        shell: pwsh
        run: >
          ./tools/VerifyReleaseAssets.ps1
          -RequireIcon
          -PublishedExe artifacts/windows-release/PromptHelper.exe

      - name: Detect optional signing configuration
        id: signing
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PFX)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)

          if ($hasCertificate -xor $hasPassword) {
            throw 'Incomplete signing configuration: configure both signing secrets or remove both.'
          }

          if ($hasCertificate) {
            'enabled=true' >> $env:GITHUB_OUTPUT
          }
          else {
            'enabled=false' >> $env:GITHUB_OUTPUT
            Write-Host 'Unsigned hobby release: no optional signing certificate is configured.'
          }

      - name: Sign release executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'prompt-helper-signing.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_PFX))

            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -File -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if ($null -eq $signTool) {
              throw 'signtool.exe was not found on the Windows runner.'
            }

            & $signTool.FullName sign `
              /fd SHA256 `
              /td SHA256 `
              /tr 'https://timestamp.digicert.com' `
              /f $certificatePath `
              /p $env:SIGNING_CERTIFICATE_PASSWORD `
              artifacts/windows-release/PromptHelper.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & $signTool.FullName verify /pa /all artifacts/windows-release/PromptHelper.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Restore pinned SBOM tool
        run: dotnet tool restore

      - name: Generate Windows SPDX SBOM
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/PromptHelper/PromptHelper.csproj
          $version = [string]$project.Project.PropertyGroup.Version

          dotnet tool run sbom-tool generate `
            -b artifacts/windows-release `
            -bc . `
            -pn PromptHelper `
            -pv $version `
            -ps Ceegore `
            -nsb https://github.com/Ceegore/AI_prompt_helper `
            -V Verbose

      - name: Generate Windows per-file checksums
        shell: pwsh
        run: |
          $releaseRoot = (Resolve-Path artifacts/windows-release).Path
          $lines = Get-ChildItem $releaseRoot -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($releaseRoot, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            }

          [IO.File]::WriteAllLines(
            (Join-Path $releaseRoot 'SHA256SUMS.txt'),
            $lines,
            [Text.UTF8Encoding]::new($false))

      - name: Package portable Windows release
        id: windows_package
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/PromptHelper/PromptHelper.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          New-Item -ItemType Directory -Path artifacts/windows-assets -Force | Out-Null

          $archiveName = "PromptHelper-v$version-win-x64.zip"
          $archivePath = Join-Path 'artifacts/windows-assets' $archiveName
          $checksumPath = "$archivePath.sha256"

          Compress-Archive -Path 'artifacts/windows-release/*' -DestinationPath $archivePath -CompressionLevel Optimal
          $hash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            $checksumPath,
            "$hash  $archiveName`n",
            [Text.UTF8Encoding]::new($false))

          $zip = [IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            foreach ($required in @(
              'PromptHelper.exe',
              'LICENSE',
              'THIRD_PARTY_NOTICES.md',
              'SHA256SUMS.txt',
              '_manifest/spdx_2.2/manifest.spdx.json')) {
              if ($entries -notcontains $required) {
                throw "Release archive is missing required entry '$required'."
              }
            }
          }
          finally {
            $zip.Dispose()
          }

      - name: Attest Windows release packages
        if: ${{ !inputs.validation_only }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/windows-assets/*

      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PromptHelper-windows-release-assets
          path: artifacts/windows-assets/*
          if-no-files-found: error

      - name: Upload Windows release test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: error

  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Verify release version
        shell: bash
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/PromptHelper.Desktop/PromptHelper.Desktop.csproj | head -n1)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag '$RELEASE_TAG' does not match Linux project version 'v$version'." >&2
            exit 1
          fi

      - name: Restore Linux tests
        run: |
          dotnet restore tests/PromptHelper.Core.Tests/PromptHelper.Core.Tests.csproj
          dotnet restore tests/PromptHelper.Platform.Linux.Tests/PromptHelper.Platform.Linux.Tests.csproj
          dotnet restore src/PromptHelper.Desktop/PromptHelper.Desktop.csproj

      - name: Build Linux code
        run: |
          dotnet build tests/PromptHelper.Core.Tests/PromptHelper.Core.Tests.csproj -c Release --no-restore
          dotnet build tests/PromptHelper.Platform.Linux.Tests/PromptHelper.Platform.Linux.Tests.csproj -c Release --no-restore
          dotnet build src/PromptHelper.Desktop/PromptHelper.Desktop.csproj -c Release --no-restore

      - name: Test Linux core and platform
        run: |
          dotnet test tests/PromptHelper.Core.Tests/PromptHelper.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=release-linux-core.trx"
          dotnet test tests/PromptHelper.Platform.Linux.Tests/PromptHelper.Platform.Linux.Tests.csproj -c Release --no-build --logger "trx;LogFileName=release-linux-platform.trx"

      - name: Publish self-contained linux-x64
        run: >
          dotnet publish src/PromptHelper.Desktop/PromptHelper.Desktop.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -o artifacts/linux-release

      - name: Verify Linux publish payload
        shell: bash
        run: |
          test -x artifacts/linux-release/PromptHelper
          test -f artifacts/linux-release/PromptHelper.dll
          test -f artifacts/linux-release/Avalonia.Desktop.dll
          test -f artifacts/linux-release/libcoreclr.so
          test -f artifacts/linux-release/LICENSE
          test -f artifacts/linux-release/THIRD_PARTY_NOTICES.md

      - name: Install Linux GUI smoke dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libx11-6 libice6 libsm6 libfontconfig1

      - name: Smoke-launch Linux desktop under Xvfb
        shell: bash
        run: |
          smoke_home="$(mktemp -d)"
          set +e
          HOME="$smoke_home" XDG_DATA_HOME="$smoke_home/data" timeout 6s xvfb-run -a artifacts/linux-release/PromptHelper >/tmp/prompthelper-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/prompthelper-smoke.log || true
          rm -rf "$smoke_home"

          if [[ $status -ne 124 ]]; then
            echo "Prompt Helper did not remain alive for the expected Xvfb smoke interval (exit $status)." >&2
            exit 1
          fi

      - name: Restore pinned SBOM tool
        run: dotnet tool restore

      - name: Generate Linux SPDX SBOM
        shell: bash
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/PromptHelper.Desktop/PromptHelper.Desktop.csproj | head -n1)"
          dotnet tool run sbom-tool generate             -b artifacts/linux-release             -bc .             -pn PromptHelper             -pv "$version"             -ps Ceegore             -nsb https://github.com/Ceegore/AI_prompt_helper             -V Verbose

      - name: Generate Linux per-file checksums
        shell: bash
        run: |
          (
            cd artifacts/linux-release
            find . -type f ! -name SHA256SUMS.txt -print0 |
              sort -z |
              xargs -0 sha256sum |
              sed 's#  \./#  #' > SHA256SUMS.txt
          )

      - name: Package Linux tarball and Debian package
        shell: bash
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/PromptHelper.Desktop/PromptHelper.Desktop.csproj | head -n1)"
          chmod +x tools/package-linux-release.sh
          tools/package-linux-release.sh "$version" artifacts/linux-release artifacts/linux-assets

          test -f "artifacts/linux-assets/PromptHelper-v$version-linux-x64.tar.gz"
          test -f "artifacts/linux-assets/PromptHelper-v$version-linux-x64.tar.gz.sha256"
          test -f "artifacts/linux-assets/prompthelper_${version}_amd64.deb"
          test -f "artifacts/linux-assets/prompthelper_${version}_amd64.deb.sha256"

      - name: Attest Linux release packages
        if: ${{ !inputs.validation_only }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/linux-assets/*

      - name: Upload Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PromptHelper-linux-release-assets
          path: artifacts/linux-assets/*
          if-no-files-found: error

      - name: Upload Linux release test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-test-results
          path: |
            tests/PromptHelper.Core.Tests/TestResults/**/*.trx
            tests/PromptHelper.Platform.Linux.Tests/TestResults/**/*.trx
          if-no-files-found: error

  publish-release:
    needs:
      - windows-package
      - linux-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Download Windows assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: PromptHelper-windows-release-assets
          path: artifacts/final

      - name: Download Linux assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: PromptHelper-linux-release-assets
          path: artifacts/final

      - name: Verify final package set and checksums
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          test -f "artifacts/final/PromptHelper-v$version-win-x64.zip"
          test -f "artifacts/final/PromptHelper-v$version-win-x64.zip.sha256"
          test -f "artifacts/final/PromptHelper-v$version-linux-x64.tar.gz"
          test -f "artifacts/final/PromptHelper-v$version-linux-x64.tar.gz.sha256"
          test -f "artifacts/final/prompthelper_${version}_amd64.deb"
          test -f "artifacts/final/prompthelper_${version}_amd64.deb.sha256"

          (
            cd artifacts/final
            sha256sum -c ./*.sha256
          )

      - name: Publish GitHub release
        if: ${{ !inputs.validation_only }}
        shell: bash
        run: |
          notes_path="docs/releases/${RELEASE_TAG}.md"
          notes_args=(--generate-notes)
          if [[ -f "$notes_path" ]]; then
            notes_args=(--notes-file "$notes_path")
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" artifacts/final/*               --verify-tag               --title "Prompt Helper $RELEASE_TAG"               "${notes_args[@]}"
          else
            gh release create "$RELEASE_TAG" artifacts/final/*               --target "$TARGET_SHA"               --title "Prompt Helper $RELEASE_TAG"               "${notes_args[@]}"
          fi

      - name: Verify published release
        if: ${{ !inputs.validation_only }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG"             --json tagName,isDraft,isPrerelease,url             --jq '.tagName + " draft=" + (.isDraft|tostring) + " prerelease=" + (.isPrerelease|tostring) + " " + .url'
