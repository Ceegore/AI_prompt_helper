name: Linux Core CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  core-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore cross-platform tests
        run: dotnet restore tests/PromptHelper.Core.Tests/PromptHelper.Core.Tests.csproj

      - name: Build cross-platform core
        run: dotnet build tests/PromptHelper.Core.Tests/PromptHelper.Core.Tests.csproj -c Release --no-restore

      - name: Test cross-platform core
        run: dotnet test tests/PromptHelper.Core.Tests/PromptHelper.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=linux-core.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-core-test-results
          path: tests/PromptHelper.Core.Tests/TestResults/**/*.trx
          if-no-files-found: error
