name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      stress:
        description: 'Run full test suite five times'
        required: false
        default: false
        type: boolean
      release_gate:
        description: 'Require all final release assets, including the real app icon'
        required: false
        default: false
        type: boolean

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # CRUU15-009: every audited finding must have a named behavioral regression test, and the
      # generated sentinel list must still match that coverage authority.
      - name: Verify finding coverage authority
        shell: pwsh
        run: ./tools/VerifyFindingCoverage.ps1

      - name: Verify repository release assets
        shell: pwsh
        run: ./tools/VerifyReleaseAssets.ps1

      # CRUU15-011: prove the committed icon is what the pinned renderer produces from the
      # approved vector source, on every push rather than only at release time.
      - name: Verify icon is reproducible from the approved vector source
        shell: pwsh
        run: ./tools/VerifyIconGeneration.ps1

      - name: Verify strict release assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate }}
        shell: pwsh
        run: ./tools/VerifyReleaseAssets.ps1 -RequireIcon

      - name: Restore
        run: dotnet restore PromptHelper.slnx

      - name: Build Release
        run: dotnet build PromptHelper.slnx -c Release --no-restore

      - name: Test Filesystem Authority
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --filter "TestCategory=FilesystemAuthority" `
            --logger "trx;LogFileName=filesystem-authority.trx"

      - name: Test Package Integrity
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --filter "TestCategory=PackageIntegrity" `
            --logger "trx;LogFileName=package-integrity.trx"

      - name: Test Mutation Recovery
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --filter "TestCategory=MutationRecovery" `
            --logger "trx;LogFileName=mutation-recovery.trx"

      - name: Test Migration Ready Gate
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --filter "TestCategory=MigrationReady" `
            --logger "trx;LogFileName=migration-ready.trx"

      - name: Test Strict UTF-8
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --filter "TestCategory=StrictUtf8" `
            --logger "trx;LogFileName=strict-utf8.trx"

      - name: Test Crash Recovery Category
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --filter "TestCategory=CrashRecovery" `
            --logger "trx;LogFileName=cruu9-crash.trx"

      - name: Test WPF Integration Category
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --filter "TestCategory=WpfIntegration" `
            --logger "trx;LogFileName=cruu9-wpf.trx"

      # CRUU15-005 requires creating file symlinks; its tests fail rather than opt out, so the
      # runner has to be able to create them.
      - name: Enable symlink creation
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null

          $probeDir = Join-Path $env:RUNNER_TEMP 'symlink-probe'
          New-Item -ItemType Directory -Path $probeDir -Force | Out-Null
          Set-Content -Path (Join-Path $probeDir 'target.txt') -Value 'probe' -Encoding utf8
          cmd /c mklink "$probeDir\link.txt" "$probeDir\target.txt"
          if ($LASTEXITCODE -ne 0) { throw 'This runner cannot create file symlinks; CRUU15-005 cannot be verified here.' }

      - name: Test Windows Filesystem Integration Category
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --filter "TestCategory=WindowsFilesystemIntegration" `
            --logger "trx;LogFileName=cruu9-winfs.trx"

      - name: Test Full Suite
        shell: pwsh
        run: |
          $runs = if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.stress }}' -eq 'true') { 5 } else { 1 }

          for ($i = 1; $i -le $runs; $i++) {
            Write-Host "=== Test Run $i of $runs ==="
            dotnet test PromptHelper.slnx `
              -c Release `
              --no-build `
              --logger "trx;LogFileName=test-results-$i.trx"

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Verify exact sentinels across all test evidence
        shell: pwsh
        run: |
          $required = Import-PowerShellDataFile ./tools/RequiredRegressionTests.psd1
          $trx = Get-ChildItem tests/PromptHelper.Tests/TestResults -Recurse -Filter '*.trx' | Select-Object -ExpandProperty FullName
          ./tools/VerifyTestEvidence.ps1 -TrxPath $trx -RequiredTests $required.Required

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish src/PromptHelper/PromptHelper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o artifacts/publish-check

      - name: Verify publish payload
        shell: pwsh
        run: |
          $required = @(
            'artifacts/publish-check/PromptHelper.exe',
            'artifacts/publish-check/LICENSE',
            'artifacts/publish-check/THIRD_PARTY_NOTICES.md'
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required publish artifact: $path"
            }
          }

      - name: Verify published executable release assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate }}
        shell: pwsh
        run: >
          ./tools/VerifyReleaseAssets.ps1
          -RequireIcon
          -PublishedExe artifacts/publish-check/PromptHelper.exe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: error

      - name: Upload publish-check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PromptHelper-publish-check
          path: artifacts/publish-check
          if-no-files-found: error
