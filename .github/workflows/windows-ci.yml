name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      stress:
        description: 'Run full test suite five times'
        required: false
        default: false
        type: boolean
      release_gate:
        description: 'Require all final release assets, including the real app icon'
        required: false
        default: false
        type: boolean

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify repository release assets
        shell: pwsh
        run: ./tools/VerifyReleaseAssets.ps1

      - name: Verify strict release assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate }}
        shell: pwsh
        run: ./tools/VerifyReleaseAssets.ps1 -RequireIcon

      - name: Restore
        run: dotnet restore PromptHelper.slnx

      - name: Build Release
        run: dotnet build PromptHelper.slnx -c Release --no-restore

      - name: Test Crash Recovery Category
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --filter "TestCategory=CrashRecovery" `
            --logger "trx;LogFileName=cruu9-crash.trx"
          ./tools/VerifyTestEvidence.ps1 -TrxPath tests/PromptHelper.Tests/TestResults/cruu9-crash.trx -RequiredTests CRUU8_006_FinalizeCommittedStartup_verifies_all_finals_and_retires_marker,CRUU9_002_Unreadable_marker_is_not_treated_as_missing,CRUU9_005_Different_source_interrupted_retry_fails_closed

      - name: Test WPF Integration Category
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --filter "TestCategory=WpfIntegration" `
            --logger "trx;LogFileName=cruu9-wpf.trx"
          ./tools/VerifyTestEvidence.ps1 -TrxPath tests/PromptHelper.Tests/TestResults/cruu9-wpf.trx -RequiredTests CRUU9_020_RestartRequired_true_Result_null_shuts_down,CRUU9_020_Restart_message_failure_still_requests_shutdown,CRUU9_020_RestartRequired_false_does_not_shutdown

      - name: Test Windows Filesystem Integration Category
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --filter "TestCategory=WindowsFilesystemIntegration" `
            --logger "trx;LogFileName=cruu9-winfs.trx"
          ./tools/VerifyTestEvidence.ps1 -TrxPath tests/PromptHelper.Tests/TestResults/cruu9-winfs.trx -RequiredTests CRUU9_001_Empty_prompts_junction_outside_target_is_rejected,CRUU9_001_Empty_recovery_junction_outside_target_is_rejected,CRUU9_001_Migration_never_writes_through_prompts_junction,CRUU9_001_Retry_never_deletes_through_prompts_junction

      - name: Test Full Suite
        shell: pwsh
        run: |
          $runs = if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.stress }}' -eq 'true') { 5 } else { 1 }

          for ($i = 1; $i -le $runs; $i++) {
            Write-Host "=== Test Run $i of $runs ==="
            dotnet test PromptHelper.slnx `
              -c Release `
              --no-build `
              --logger "trx;LogFileName=test-results-$i.trx"

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            ./tools/VerifyTestEvidence.ps1 -TrxPath tests/PromptHelper.Tests/TestResults/test-results-$i.trx
          }

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish src/PromptHelper/PromptHelper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o artifacts/publish-check

      - name: Verify publish payload
        shell: pwsh
        run: |
          $required = @(
            'artifacts/publish-check/PromptHelper.exe',
            'artifacts/publish-check/LICENSE',
            'artifacts/publish-check/THIRD_PARTY_NOTICES.md'
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required publish artifact: $path"
            }
          }

      - name: Verify published executable release assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate }}
        shell: pwsh
        run: >
          ./tools/VerifyReleaseAssets.ps1
          -RequireIcon
          -PublishedExe artifacts/publish-check/PromptHelper.exe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: error

      - name: Upload publish-check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PromptHelper-publish-check
          path: artifacts/publish-check
          if-no-files-found: error
