name: Publish v0.5.1

on:
  push:
    branches:
      - main
    paths:
      - 'docs/releases/v0.5.1.md'
      - 'src/PromptHelper/PromptHelper.csproj'
      - 'src/PromptHelper.Desktop/PromptHelper.Desktop.csproj'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    uses: ./.github/workflows/release.yml
    with:
      release_tag: v0.5.1
      target_sha: ${{ github.sha }}
      validation_only: false
    secrets: inherit
