name: Publish Prompt Helper v0.2.0

# One-shot publisher. It runs when this file lands on main and is removed after the release.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.2.0.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish-v0-2-0:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'

      - name: Verify exact release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/PromptHelper/PromptHelper.csproj
          if ([string]$project.Project.PropertyGroup.Version -ne '0.2.0') {
            throw 'The one-shot publisher requires project version 0.2.0.'
          }

          gh release view v0.2.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw 'Release v0.2.0 already exists; refusing to overwrite it.'
          }
          $global:LASTEXITCODE = 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify finding coverage authority
        shell: pwsh
        run: ./tools/VerifyFindingCoverage.ps1

      - name: Verify repository release assets
        shell: pwsh
        run: ./tools/VerifyReleaseAssets.ps1 -RequireIcon

      - name: Verify icon is reproducible from the approved vector source
        shell: pwsh
        run: ./tools/VerifyIconGeneration.ps1

      - name: Audit icon generator dependencies
        run: npm audit --package-lock-only --audit-level=high --prefix tools/icon-generator

      - name: Restore
        run: dotnet restore PromptHelper.slnx

      - name: Build Release
        run: dotnet build PromptHelper.slnx -c Release --no-restore

      - name: Enable symlink creation
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null

          $probeDir = Join-Path $env:RUNNER_TEMP 'symlink-probe'
          New-Item -ItemType Directory -Path $probeDir -Force | Out-Null
          Set-Content -Path (Join-Path $probeDir 'target.txt') -Value 'probe' -Encoding utf8
          cmd /c mklink "$probeDir\link.txt" "$probeDir\target.txt"
          if ($LASTEXITCODE -ne 0) { throw 'This runner cannot create file symlinks.' }

      - name: Full test suite
        shell: pwsh
        run: |
          dotnet test PromptHelper.slnx `
            -c Release `
            --no-build `
            --logger "trx;LogFileName=release-v0.2.0-tests.trx"

      - name: Verify exact sentinels across all test evidence
        shell: pwsh
        run: |
          $required = Import-PowerShellDataFile ./tools/RequiredRegressionTests.psd1
          $trx = Get-ChildItem tests/PromptHelper.Tests/TestResults -Recurse -Filter '*.trx' | Select-Object -ExpandProperty FullName
          ./tools/VerifyTestEvidence.ps1 -TrxPath $trx -RequiredTests $required.Required

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish src/PromptHelper/PromptHelper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o artifacts/release

      - name: Verify published executable icon chain
        shell: pwsh
        run: >
          ./tools/VerifyReleaseAssets.ps1
          -RequireIcon
          -PublishedExe artifacts/release/PromptHelper.exe

      - name: Detect optional signing configuration
        id: signing
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PFX)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw 'Configure both signing secrets or remove both.'
          }
          "enabled=$($hasCertificate.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Sign release executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'prompt-helper-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_PFX))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -File -Recurse |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $signTool) { throw 'signtool.exe was not found.' }
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr 'https://timestamp.digicert.com' `
              /f $certificatePath /p $env:SIGNING_CERTIFICATE_PASSWORD artifacts/release/PromptHelper.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $signTool.FullName verify /pa /all artifacts/release/PromptHelper.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Restore pinned SBOM tool
        run: dotnet tool restore

      - name: Generate SPDX SBOM
        shell: pwsh
        run: |
          dotnet tool run sbom-tool generate `
            -b artifacts/release `
            -bc . `
            -pn PromptHelper `
            -pv 0.2.0 `
            -ps Ceegore `
            -nsb https://github.com/Ceegore/AI_prompt_helper `
            -V Verbose

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $releaseRoot = (Resolve-Path artifacts/release).Path
          $lines = Get-ChildItem $releaseRoot -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($releaseRoot, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            }
          [IO.File]::WriteAllLines(
            (Join-Path $releaseRoot 'SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))

      - name: Package release archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/release/* `
            -DestinationPath artifacts/PromptHelper-v0.2.0-win-x64.zip `
            -CompressionLevel Optimal

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            artifacts/release/**
            artifacts/PromptHelper-v0.2.0-win-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PromptHelper-v0.2.0-release
          path: artifacts/release
          if-no-files-found: error

      - name: Create GitHub Release v0.2.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 `
            artifacts/PromptHelper-v0.2.0-win-x64.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'Prompt Helper v0.2.0' `
            --notes-file docs/release-notes/v0.2.0.md

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-v0.2.0-test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: error
